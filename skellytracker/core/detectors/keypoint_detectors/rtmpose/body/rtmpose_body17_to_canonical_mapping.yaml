# RTMPose standalone body detector (COCO17, no feet) -> canonical body
# landmark mapping.
#
# Scoped to the 17 points RTMPoseBodyDetector's own `tracked_points` list
# actually contains (see coco17_tracked_points.yaml) — unlike
# rtmpose_body_to_canonical_mapping.yaml (23 points incl. feet), which is
# authored for the wholebody composition's body slice and would fail the
# sidecar's canonical_mapping-references-tracked_points validation here.
#
#   string  ->  1:1 passthrough  (canonical = tracker keypoint at that name)
#   list    ->  unweighted mean   (canonical = mean of listed tracker keypoints)

nose: "nose"
left_eye: "left_eye"
right_eye: "right_eye"
left_ear: "left_ear"
right_ear: "right_ear"
left_shoulder: "left_shoulder"
right_shoulder: "right_shoulder"
left_elbow: "left_elbow"
right_elbow: "right_elbow"
left_wrist: "left_wrist"
right_wrist: "right_wrist"
left_hip: "left_hip"
right_hip: "right_hip"
left_knee: "left_knee"
right_knee: "right_knee"
left_ankle: "left_ankle"
right_ankle: "right_ankle"

# ---- Computed landmarks (mean of tracker keypoints) ----
head_center: ["left_ear", "right_ear"]
neck_center: ["left_shoulder", "right_shoulder"]
trunk_center: ["left_shoulder", "right_shoulder", "left_hip", "right_hip"]
hips_center: ["left_hip", "right_hip"]
