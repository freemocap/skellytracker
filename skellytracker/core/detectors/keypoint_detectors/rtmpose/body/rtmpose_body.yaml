---
# RTMPose body tracked points and skeleton connections.
# 23 keypoints (COCO17 + 6 foot points) in native body7 model channel order.
# The body7 models emit the foot channels — every one is listed so the tracker
# never drops its own keypoints. Models: rtmpose-s/m_simcc-body7.
name: rtmpose_body
tracker_type: rtmpose
landmark_schema: COCO17 + foot

tracked_points:
  - nose
  - left_eye
  - right_eye
  - left_ear
  - right_ear
  - left_shoulder
  - right_shoulder
  - left_elbow
  - right_elbow
  - left_wrist
  - right_wrist
  - left_hip
  - right_hip
  - left_knee
  - right_knee
  - left_ankle
  - right_ankle
  - left_big_toe
  - left_small_toe
  - left_heel
  - right_big_toe
  - right_small_toe
  - right_heel

connections:
  # face
  - [nose, left_eye]
  - [nose, right_eye]
  - [left_eye, left_ear]
  - [right_eye, right_ear]
  # shoulder girdle
  - [left_shoulder, right_shoulder]
  # left arm
  - [left_shoulder, left_elbow]
  - [left_elbow, left_wrist]
  # right arm
  - [right_shoulder, right_elbow]
  - [right_elbow, right_wrist]
  # torso
  - [left_shoulder, left_hip]
  - [right_shoulder, right_hip]
  - [left_hip, right_hip]
  # left leg
  - [left_hip, left_knee]
  - [left_knee, left_ankle]
  # right leg
  - [right_hip, right_knee]
  - [right_knee, right_ankle]
