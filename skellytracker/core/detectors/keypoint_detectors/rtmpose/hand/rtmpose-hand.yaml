---
schema_version: "v2024.09.1019"
model_id: rtmpose-hand
display_name: RTMPose Hand
role: [pose_estimator]

input:
  name: input
  dtype:
    fp32: float32
  layout: NCHW
  normalization: imagenet_bgr
  resize:
    method: affine_person_crop
    interpolation: linear
    crop_policy:
      expand_ratio: 1.25
      maintain_aspect_ratio: true

batching:
  batch_axis: 0

outputs:
  - name: simcc_x
    dtype:
      fp32: float32
    semantic: simcc_x
    keypoint_axis: 1
    keypoint_count: 21
  - name: simcc_y
    dtype:
      fp32: float32
    semantic: simcc_y
    keypoint_axis: 1
    keypoint_count: 21

pose:
  estimator_type: top_down_single_person
  requires_object_detector: true
  landmark_schema: COCO_WholeBody
  tracked_points: {$ref: ../../../shared/skeletons/hand21_tracked_points.yaml}
  connections: {$ref: ../../../shared/skeletons/hand21_skeletons.yaml}
  canonical_mapping: {$ref: rtmpose_hand_to_canonical_mapping.yaml}
  decode:
    method: simcc

overlay:
  skeleton: rtmpose_hand_skeleton

sizes:
  rtmpose-m_256x256:
    input:
      shape: [-1, 3, 256, 256]
      resize:
        target_size: [256, 256]
    onnx:
      batch_artifacts:
        "1":
          precision_artifacts:
            fp32:
              filename: rtmpose-m_256x256_hand_b1_fp32.onnx
              url: https://download.openmmlab.com/mmpose/v1/projects/rtmposev1/onnx_sdk/rtmpose-m_simcc-hand5_pt-aic-coco_210e-256x256-74fb594_20230320.zip
              url_sha256: "45c9e1aa21b8fe33859973c49bce4647645d312e7a226e398a42f9137d44a56d"
