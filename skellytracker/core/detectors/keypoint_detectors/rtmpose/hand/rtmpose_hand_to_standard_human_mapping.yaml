# RTMPose (wholebody) hand → standard-human hand landmark hydration.
#
# The realtime RTMPose path runs the wholebody detector, whose hand keypoints are
# side-prefixed (left_hand_* / right_hand_*) and use the COCO-WholeBody hand naming
# (thumb1..4, forefinger1..4, middle_finger1..4, ring_finger1..4, pinky_finger1..4).
#
# Keys are the standard human SIDED hand landmark names (left_*/right_*); values are the
# RTMPose hand keypoints. The wrist is NOT mapped here: it is hydrated by the body mapping
# (left_wrist/right_wrist), the shared arm<->hand joint (its landmark is carpal_origin).
# The finger CMC joints (index/middle/ring/pinky metacarpal bases) have no tracker
# keypoint, so they are DERIVED below: each knuckle (MCP) is walked back along its own
# finger direction by the metacarpal's authored length (hand.yaml: index 65, middle 68,
# ring 60, pinky 50 mm) expressed as a ratio of the observed proximal-phalanx length
# (MCP->PIP). The carpal bones (scaphoid, lunate, triquetrum, pisiform, trapezoid,
# capitate, hamate, trapezium) still ride the carpals rigid solve once the CMC joints
# and carpal_origin are observed; thumb_cmc has a tracker keypoint (thumb1).

left_thumb_cmc: "left_hand_thumb1"
left_thumb_mcp: "left_hand_thumb2"
left_thumb_ip: "left_hand_thumb3"
left_thumb_tip: "left_hand_thumb4"
left_index_mcp: "left_hand_forefinger1"
left_index_pip: "left_hand_forefinger2"
left_index_dip: "left_hand_forefinger3"
left_index_tip: "left_hand_forefinger4"
left_middle_mcp: "left_hand_middle_finger1"
left_middle_pip: "left_hand_middle_finger2"
left_middle_dip: "left_hand_middle_finger3"
left_middle_tip: "left_hand_middle_finger4"
left_ring_mcp: "left_hand_ring_finger1"
left_ring_pip: "left_hand_ring_finger2"
left_ring_dip: "left_hand_ring_finger3"
left_ring_tip: "left_hand_ring_finger4"
left_pinky_mcp: "left_hand_pinky_finger1"
left_pinky_pip: "left_hand_pinky_finger2"
left_pinky_dip: "left_hand_pinky_finger3"
left_pinky_tip: "left_hand_pinky_finger4"
right_thumb_cmc: "right_hand_thumb1"
right_thumb_mcp: "right_hand_thumb2"
right_thumb_ip: "right_hand_thumb3"
right_thumb_tip: "right_hand_thumb4"
right_index_mcp: "right_hand_forefinger1"
right_index_pip: "right_hand_forefinger2"
right_index_dip: "right_hand_forefinger3"
right_index_tip: "right_hand_forefinger4"
right_middle_mcp: "right_hand_middle_finger1"
right_middle_pip: "right_hand_middle_finger2"
right_middle_dip: "right_hand_middle_finger3"
right_middle_tip: "right_hand_middle_finger4"
right_ring_mcp: "right_hand_ring_finger1"
right_ring_pip: "right_hand_ring_finger2"
right_ring_dip: "right_hand_ring_finger3"
right_ring_tip: "right_hand_ring_finger4"
right_pinky_mcp: "right_hand_pinky_finger1"
right_pinky_pip: "right_hand_pinky_finger2"
right_pinky_dip: "right_hand_pinky_finger3"
right_pinky_tip: "right_hand_pinky_finger4"

# ---- Derived: finger CMC joints (palm end of each metacarpal) --------------------
# Walk each knuckle back along the finger's own proximal-phalanx direction (MCP->PIP)
# by the metacarpal's authored length, as a ratio of the observed phalanx length:
#   index 65/40, middle 68/45, ring 60/40, pinky 50/30 mm.
# The `radial` axis (thumb->pinky) only orients the frame; the offset uses `distal`.
left_index_cmc:
  form: anatomical_offset
  origin: ["left_index_mcp"]
  frame:
    distal: {from: left_index_mcp, to: left_index_pip, kind: exact}
    radial: {from: left_thumb_mcp, to: left_pinky_mcp, kind: approximate}
  offset: {distal: -1.625}
  reference_length: {from: left_index_mcp, to: left_index_pip}
left_middle_cmc:
  form: anatomical_offset
  origin: ["left_middle_mcp"]
  frame:
    distal: {from: left_middle_mcp, to: left_middle_pip, kind: exact}
    radial: {from: left_thumb_mcp, to: left_pinky_mcp, kind: approximate}
  offset: {distal: -1.511111111}
  reference_length: {from: left_middle_mcp, to: left_middle_pip}
left_ring_cmc:
  form: anatomical_offset
  origin: ["left_ring_mcp"]
  frame:
    distal: {from: left_ring_mcp, to: left_ring_pip, kind: exact}
    radial: {from: left_thumb_mcp, to: left_pinky_mcp, kind: approximate}
  offset: {distal: -1.5}
  reference_length: {from: left_ring_mcp, to: left_ring_pip}
left_pinky_cmc:
  form: anatomical_offset
  origin: ["left_pinky_mcp"]
  frame:
    distal: {from: left_pinky_mcp, to: left_pinky_pip, kind: exact}
    radial: {from: left_thumb_mcp, to: left_pinky_mcp, kind: approximate}
  offset: {distal: -1.666666667}
  reference_length: {from: left_pinky_mcp, to: left_pinky_pip}
right_index_cmc:
  form: anatomical_offset
  origin: ["right_index_mcp"]
  frame:
    distal: {from: right_index_mcp, to: right_index_pip, kind: exact}
    radial: {from: right_thumb_mcp, to: right_pinky_mcp, kind: approximate}
  offset: {distal: -1.625}
  reference_length: {from: right_index_mcp, to: right_index_pip}
right_middle_cmc:
  form: anatomical_offset
  origin: ["right_middle_mcp"]
  frame:
    distal: {from: right_middle_mcp, to: right_middle_pip, kind: exact}
    radial: {from: right_thumb_mcp, to: right_pinky_mcp, kind: approximate}
  offset: {distal: -1.511111111}
  reference_length: {from: right_middle_mcp, to: right_middle_pip}
right_ring_cmc:
  form: anatomical_offset
  origin: ["right_ring_mcp"]
  frame:
    distal: {from: right_ring_mcp, to: right_ring_pip, kind: exact}
    radial: {from: right_thumb_mcp, to: right_pinky_mcp, kind: approximate}
  offset: {distal: -1.5}
  reference_length: {from: right_ring_mcp, to: right_ring_pip}
right_pinky_cmc:
  form: anatomical_offset
  origin: ["right_pinky_mcp"]
  frame:
    distal: {from: right_pinky_mcp, to: right_pinky_pip, kind: exact}
    radial: {from: right_thumb_mcp, to: right_pinky_mcp, kind: approximate}
  offset: {distal: -1.666666667}
  reference_length: {from: right_pinky_mcp, to: right_pinky_pip}
