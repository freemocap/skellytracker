# RTMPose (wholebody) hand -> standard-human hand landmark hydration.
#
# The realtime RTMPose path runs the wholebody detector, whose hand keypoints
# are side-prefixed (left_hand_* / right_hand_*) and use the COCO-WholeBody
# hand naming (thumb1..4, forefinger1..4, middle_finger1..4, ring_finger1..4,
# pinky_finger1..4, root).
#
# Keys are the standard human's SIDED hand landmark names (left_hand_* / right_hand_* -
# the hand.yaml part is instantiated left_hand_*/right_hand_*); values are the RTMPose
# wholebody hand keypoints that hydrate them. The wrist (root) is NOT mapped
# here: it is hydrated by the body mapping (left_wrist/right_wrist from the
# pose), the shared arm<->hand joint.
#
# Reconciliation (RTMPose wholebody -> standard human):
#   thumb1..4         -> hand_thumb_cmc/mcp/ip/tip
#   forefinger1..4    -> hand_index_mcp/pip/dip/tip
#   middle_finger1..4 -> hand_middle_mcp/pip/dip/tip
#   ring_finger1..4   -> hand_ring_mcp/pip/dip/tip
#   pinky_finger1..4  -> hand_little_mcp/pip/dip/tip

left_hand_thumb_cmc: "left_hand_thumb1"
left_hand_thumb_mcp: "left_hand_thumb2"
left_hand_thumb_ip: "left_hand_thumb3"
left_hand_thumb_tip: "left_hand_thumb4"
left_hand_index_mcp: "left_hand_forefinger1"
left_hand_index_pip: "left_hand_forefinger2"
left_hand_index_dip: "left_hand_forefinger3"
left_hand_index_tip: "left_hand_forefinger4"
left_hand_middle_mcp: "left_hand_middle_finger1"
left_hand_middle_pip: "left_hand_middle_finger2"
left_hand_middle_dip: "left_hand_middle_finger3"
left_hand_middle_tip: "left_hand_middle_finger4"
left_hand_ring_mcp: "left_hand_ring_finger1"
left_hand_ring_pip: "left_hand_ring_finger2"
left_hand_ring_dip: "left_hand_ring_finger3"
left_hand_ring_tip: "left_hand_ring_finger4"
left_hand_little_mcp: "left_hand_pinky_finger1"
left_hand_little_pip: "left_hand_pinky_finger2"
left_hand_little_dip: "left_hand_pinky_finger3"
left_hand_little_tip: "left_hand_pinky_finger4"

right_hand_thumb_cmc: "right_hand_thumb1"
right_hand_thumb_mcp: "right_hand_thumb2"
right_hand_thumb_ip: "right_hand_thumb3"
right_hand_thumb_tip: "right_hand_thumb4"
right_hand_index_mcp: "right_hand_forefinger1"
right_hand_index_pip: "right_hand_forefinger2"
right_hand_index_dip: "right_hand_forefinger3"
right_hand_index_tip: "right_hand_forefinger4"
right_hand_middle_mcp: "right_hand_middle_finger1"
right_hand_middle_pip: "right_hand_middle_finger2"
right_hand_middle_dip: "right_hand_middle_finger3"
right_hand_middle_tip: "right_hand_middle_finger4"
right_hand_ring_mcp: "right_hand_ring_finger1"
right_hand_ring_pip: "right_hand_ring_finger2"
right_hand_ring_dip: "right_hand_ring_finger3"
right_hand_ring_tip: "right_hand_ring_finger4"
right_hand_little_mcp: "right_hand_pinky_finger1"
right_hand_little_pip: "right_hand_pinky_finger2"
right_hand_little_dip: "right_hand_pinky_finger3"
right_hand_little_tip: "right_hand_pinky_finger4"
