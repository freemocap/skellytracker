# MediaPipe hand → standard-human keypoint mapping.
#
# Identity mapping — MediaPipe Hand keypoint names ARE the standard human's
# hand keypoint names. Both use the same 21-point naming convention:
# wrist, thumb_cmc, thumb_mcp, thumb_ip, thumb_tip,
# index_finger_mcp/pip/dip/tip, middle_finger_mcp/pip/dip/tip,
# ring_finger_mcp/pip/dip/tip, pinky_mcp/pip/dip/tip.

wrist: "wrist"
thumb_cmc: "thumb_cmc"
thumb_mcp: "thumb_mcp"
thumb_ip: "thumb_ip"
thumb_tip: "thumb_tip"
index_finger_mcp: "index_finger_mcp"
index_finger_pip: "index_finger_pip"
index_finger_dip: "index_finger_dip"
index_finger_tip: "index_finger_tip"
middle_finger_mcp: "middle_finger_mcp"
middle_finger_pip: "middle_finger_pip"
middle_finger_dip: "middle_finger_dip"
middle_finger_tip: "middle_finger_tip"
ring_finger_mcp: "ring_finger_mcp"
ring_finger_pip: "ring_finger_pip"
ring_finger_dip: "ring_finger_dip"
ring_finger_tip: "ring_finger_tip"
pinky_mcp: "pinky_mcp"
pinky_pip: "pinky_pip"
pinky_dip: "pinky_dip"
pinky_tip: "pinky_tip"
