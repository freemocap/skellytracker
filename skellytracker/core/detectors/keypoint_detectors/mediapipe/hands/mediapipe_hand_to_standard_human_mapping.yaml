# MediaPipe hand → standard-human hand landmark hydration.
#
# The realtime path triangulates the MediaPipe HandLandmarker stage, whose keypoints are
# side-prefixed (left_hand_* / right_hand_*) and use the MediaPipe Hand 21-point naming
# (thumb_cmc, thumb_mcp, thumb_ip, thumb_tip, index_finger_mcp, ...).
#
# Keys are the standard human SIDED hand landmark names (left_*/right_*); values are the
# MediaPipe hand keypoints. The wrist is NOT mapped here: it is hydrated by the body
# mapping (left_wrist/right_wrist), the shared arm<->hand joint (its landmark is
# carpal_origin). The derived carpal bones and the finger CMC joints ride the hand rigid
# solve and are not mapped; only thumb_cmc has a tracker keypoint (thumb_cmc).

left_thumb_cmc: "left_hand_thumb_cmc"
left_thumb_mcp: "left_hand_thumb_mcp"
left_thumb_ip: "left_hand_thumb_ip"
left_thumb_tip: "left_hand_thumb_tip"
left_index_mcp: "left_hand_index_finger_mcp"
left_index_pip: "left_hand_index_finger_pip"
left_index_dip: "left_hand_index_finger_dip"
left_index_tip: "left_hand_index_finger_tip"
