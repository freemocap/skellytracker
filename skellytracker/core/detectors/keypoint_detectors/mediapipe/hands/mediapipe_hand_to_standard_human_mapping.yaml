# MediaPipe hand → standard-human hand landmark hydration.
#
# The realtime path triangulates the MediaPipe HandLandmarker stage, whose keypoints are
# side-prefixed (left_hand_* / right_hand_*) and use the MediaPipe Hand 21-point naming
# (thumb_cmc, thumb_mcp, thumb_ip, thumb_tip, index_finger_mcp, ...).
#
# Keys are the standard human SIDED hand landmark names (left_*/right_*); values are the
# MediaPipe hand keypoints. The wrist is NOT mapped here: it is hydrated by the body
# mapping (left_wrist/right_wrist), the shared arm<->hand joint (its landmark is
# carpal_origin).
# Thumb CMC is measured directly. The other four CMCs are estimated below with
# anatomical offsets; individual carpal-bone landmarks remain model geometry.

left_thumb_cmc: "left_hand_thumb_cmc"
left_thumb_mcp: "left_hand_thumb_mcp"
left_thumb_ip: "left_hand_thumb_ip"
left_thumb_tip: "left_hand_thumb_tip"
left_index_mcp: "left_hand_index_finger_mcp"
left_index_pip: "left_hand_index_finger_pip"
left_index_dip: "left_hand_index_finger_dip"
left_index_tip: "left_hand_index_finger_tip"
left_middle_mcp: "left_hand_middle_finger_mcp"
left_middle_pip: "left_hand_middle_finger_pip"
left_middle_dip: "left_hand_middle_finger_dip"
left_middle_tip: "left_hand_middle_finger_tip"
left_ring_mcp: "left_hand_ring_finger_mcp"
left_ring_pip: "left_hand_ring_finger_pip"
left_ring_dip: "left_hand_ring_finger_dip"
left_ring_tip: "left_hand_ring_finger_tip"
left_pinky_mcp: "left_hand_pinky_mcp"
left_pinky_pip: "left_hand_pinky_pip"
left_pinky_dip: "left_hand_pinky_dip"
left_pinky_tip: "left_hand_pinky_tip"
right_thumb_cmc: "right_hand_thumb_cmc"
right_thumb_mcp: "right_hand_thumb_mcp"
right_thumb_ip: "right_hand_thumb_ip"
right_thumb_tip: "right_hand_thumb_tip"
right_index_mcp: "right_hand_index_finger_mcp"
right_index_pip: "right_hand_index_finger_pip"
right_index_dip: "right_hand_index_finger_dip"
right_index_tip: "right_hand_index_finger_tip"
right_middle_mcp: "right_hand_middle_finger_mcp"
right_middle_pip: "right_hand_middle_finger_pip"
right_middle_dip: "right_hand_middle_finger_dip"
right_middle_tip: "right_hand_middle_finger_tip"
right_ring_mcp: "right_hand_ring_finger_mcp"
right_ring_pip: "right_hand_ring_finger_pip"
right_ring_dip: "right_hand_ring_finger_dip"
right_ring_tip: "right_hand_ring_finger_tip"
right_pinky_mcp: "right_hand_pinky_mcp"
right_pinky_pip: "right_hand_pinky_pip"
right_pinky_dip: "right_hand_pinky_dip"
right_pinky_tip: "right_hand_pinky_tip"

# CMC estimates in an observed palm frame, not independent measurements.
# Longitudinal: wrist -> middle MCP; indexward: wrist -> index MCP,
# orthogonalized against longitudinal. Reference length is wrist -> middle MCP.
# Ratios come from standard-human rest geometry: longitudinal = .015185/.056489;
# indexward = {.006682, 0, -.006074, -.011541}/.056489.
# These define attachment estimates, not a rigid fit of the tracked palm.
# Both sides use an indexward axis, so their coefficients have the same signs.
# Missing/degenerate frame inputs omit these estimates; there is no rest fallback.
left_index_cmc:
  form: anatomical_offset
  origin: [left_wrist]
  frame:
    longitudinal:
      from: left_wrist
      to: left_hand_middle_finger_mcp
      kind: exact
    indexward:
      from: left_wrist
      to: left_hand_index_finger_mcp
      kind: approximate
  offset:
    longitudinal: 0.2688133972985891
    indexward: 0.11828851634831558
  reference_length:
    from: left_wrist
    to: left_hand_middle_finger_mcp
left_middle_cmc:
  form: anatomical_offset
  origin: [left_wrist]
  frame:
    longitudinal:
      from: left_wrist
      to: left_hand_middle_finger_mcp
      kind: exact
    indexward:
      from: left_wrist
      to: left_hand_index_finger_mcp
      kind: approximate
  offset:
    longitudinal: 0.2688133972985891
    indexward: 0.0
  reference_length:
    from: left_wrist
    to: left_hand_middle_finger_mcp
left_ring_cmc:
  form: anatomical_offset
  origin: [left_wrist]
  frame:
    longitudinal:
      from: left_wrist
      to: left_hand_middle_finger_mcp
      kind: exact
    indexward:
      from: left_wrist
      to: left_hand_index_finger_mcp
      kind: approximate
  offset:
    longitudinal: 0.2688133972985891
    indexward: -0.10752535891943561
  reference_length:
    from: left_wrist
    to: left_hand_middle_finger_mcp
left_pinky_cmc:
  form: anatomical_offset
  origin: [left_wrist]
