# MediaPipe hand -> standard-human hand landmark hydration.
#
# The realtime path triangulates the MediaPipe HandLandmarker stage, whose
# keypoints are side-prefixed (left_hand_* / right_hand_*) and use the
# MediaPipe Hand 21-point naming (thumb_cmc, thumb_mcp, index_finger_mcp, ...).
#
# Keys are the standard human SIDED hand landmark names (left_hand_*/right_hand_*);
# values are the MediaPipe hand keypoints that hydrate them. The wrist is NOT
# mapped here: it is hydrated by the body mapping (left_wrist/right_wrist from
# the pose), the shared arm<->hand joint. The seven derived carpal bones
# (scaphoid, lunate, triquetrum, pisiform, trapezoid, capitate, hamate) ride the
# hand rigid solve and are not mapped; only the trapezium (the thumb
# carpometacarpal joint) has a tracker keypoint (thumb_cmc).
#
left_hand_trapezium: "left_hand_thumb_cmc"
left_hand_thumb_metacarpophalangeal_joint: "left_hand_thumb_mcp"
left_hand_thumb_interphalangeal_joint: "left_hand_thumb_ip"
left_hand_thumb_tip: "left_hand_thumb_tip"
left_hand_index_finger_metacarpophalangeal_joint: "left_hand_index_finger_mcp"
left_hand_index_finger_proximal_interphalangeal_joint: "left_hand_index_finger_pip"
left_hand_index_finger_distal_interphalangeal_joint: "left_hand_index_finger_dip"
left_hand_index_finger_tip: "left_hand_index_finger_tip"
left_hand_middle_finger_metacarpophalangeal_joint: "left_hand_middle_finger_mcp"
left_hand_middle_finger_proximal_interphalangeal_joint: "left_hand_middle_finger_pip"
left_hand_middle_finger_distal_interphalangeal_joint: "left_hand_middle_finger_dip"
left_hand_middle_finger_tip: "left_hand_middle_finger_tip"
left_hand_ring_finger_metacarpophalangeal_joint: "left_hand_ring_finger_mcp"
left_hand_ring_finger_proximal_interphalangeal_joint: "left_hand_ring_finger_pip"
left_hand_ring_finger_distal_interphalangeal_joint: "left_hand_ring_finger_dip"
left_hand_ring_finger_tip: "left_hand_ring_finger_tip"
left_hand_pinky_finger_metacarpophalangeal_joint: "left_hand_pinky_mcp"
left_hand_pinky_finger_proximal_interphalangeal_joint: "left_hand_pinky_pip"
left_hand_pinky_finger_distal_interphalangeal_joint: "left_hand_pinky_dip"
left_hand_pinky_finger_tip: "left_hand_pinky_tip"
right_hand_trapezium: "right_hand_thumb_cmc"
right_hand_thumb_metacarpophalangeal_joint: "right_hand_thumb_mcp"
right_hand_thumb_interphalangeal_joint: "right_hand_thumb_ip"
right_hand_thumb_tip: "right_hand_thumb_tip"
right_hand_index_finger_metacarpophalangeal_joint: "right_hand_index_finger_mcp"
right_hand_index_finger_proximal_interphalangeal_joint: "right_hand_index_finger_pip"
right_hand_index_finger_distal_interphalangeal_joint: "right_hand_index_finger_dip"
