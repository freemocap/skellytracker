left_hand_middle_mcp: "left_hand_middle_finger_mcp"
left_hand_middle_pip: "left_hand_middle_finger_pip"
left_hand_middle_dip: "left_hand_middle_finger_dip"
left_hand_middle_tip: "left_hand_middle_finger_tip"
left_hand_ring_mcp: "left_hand_ring_finger_mcp"
left_hand_ring_pip: "left_hand_ring_finger_pip"
left_hand_ring_dip: "left_hand_ring_finger_dip"
left_hand_ring_tip: "left_hand_ring_finger_tip"
left_hand_little_mcp: "left_hand_pinky_mcp"
left_hand_little_pip: "left_hand_pinky_pip"
left_hand_little_dip: "left_hand_pinky_dip"
left_hand_little_tip: "left_hand_pinky_tip"

