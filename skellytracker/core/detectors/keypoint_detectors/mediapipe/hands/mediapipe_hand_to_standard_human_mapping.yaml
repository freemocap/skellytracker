left_hand_thumb_mcp: "left_hand_thumb_mcp"
left_hand_thumb_ip: "left_hand_thumb_ip"
left_hand_thumb_tip: "left_hand_thumb_tip"
left_hand_index_mcp: "left_hand_index_finger_mcp"
left_hand_index_pip: "left_hand_index_finger_pip"
