# MediaPipe body → standard-human keypoint mapping.
#
# Maps MediaPipe Pose (33-keypoint) keypoint names to the standard human's
# keypoint names (COCO-WholeBody convention).
#
# Three mapping forms:
#   string  →  1:1 passthrough
#   list    →  unweighted mean of listed keypoints
#   dict    →  weighted sum of name:weight pairs
#
# MediaPipe body differences from the standard human:
#   - Uses left_foot_index / right_foot_index instead of
#     left_big_toe / left_small_toe
#   - Has extra face-related body points (left_eye_inner, mouth_left, etc.)
#     that have no standard-human analogue — these are not mapped.

# ---- Direct 1:1 (shared COCO names) ----
nose: "nose"
left_eye: "left_eye"
right_eye: "right_eye"
left_ear: "left_ear"
right_ear: "right_ear"
left_shoulder: "left_shoulder"
right_shoulder: "right_shoulder"
left_elbow: "left_elbow"
right_elbow: "right_elbow"
left_wrist: "left_wrist"
right_wrist: "right_wrist"
left_hip: "left_hip"
right_hip: "right_hip"
left_knee: "left_knee"
right_knee: "right_knee"
left_ankle: "left_ankle"
right_ankle: "right_ankle"
left_heel: "left_heel"
right_heel: "right_heel"

# ---- MediaPipe → standard-human foot name mapping ----
left_big_toe: "left_foot_index"
left_small_toe: "left_foot_index"    # MediaPipe has no small_toe; map to foot_index
right_big_toe: "right_foot_index"
right_small_toe: "right_foot_index"

# ---- Computed keypoints ----
head_center: ["left_ear", "right_ear"]
neck_center: ["left_shoulder", "right_shoulder"]
trunk_center: ["left_shoulder", "right_shoulder", "left_hip", "right_hip"]
hips_center: ["left_hip", "right_hip"]


# ---- Off-surface joint centers (anatomical_offset) ----
#
# These sit OFF the marked surface, so the convex forms above cannot produce
# them: anatomical_offset builds a local anatomical frame from keypoints and
# applies an anthropometric offset that scales with the subject.
#
# Definitions are identical to the RTMPose mapping, deliberately. Every tracker
# must produce the FULL standard-human keypoint set — otherwise the standard
# human model would mean different things depending on which detector happened
# to run, which is the one thing this boundary exists to prevent.
#
# The sternoclavicular joints are BILATERAL — one either side of the midline at
# the manubrium. Both are placed from the same trunk frame: origin at the
# shoulder midpoint (the midline reference), then offset anterior, slightly
# inferior, and laterally to each side.
#
# `lateral` runs left_shoulder -> right_shoulder, so +lateral is the subject's
# RIGHT and -lateral is their LEFT.
#
# ALL VALUES ARE RATIOS OF `reference_length` (here shoulder_width = biacromial
# breadth), never absolute distances — the keypoint must scale with the subject,
# and a millimetre constant would silently assume one body size. Expressed as
# fractions of biacromial width W:
#
#   anterior  0.15  -> the manubrium sits well anterior of the acromion line
#   up       -0.05  -> the sternal notch sits below acromion level
#   lateral +-0.06  -> half the inter-SC spacing, so the joints are 0.12 W apart
#
# Anthropometric basis: the SC joints straddle the manubrium at roughly an
# eighth of biacromial breadth apart, and the manubrium lies forward of and
# below the acromion line. Estimated from surface anatomy rather than taken from
# a published table — Winter and Drillis & Contini tabulate segment lengths, not
# SC joint placement. Refine if a sourced value appears.

left_sternoclavicular:
  form: anatomical_offset
  origin: ["left_shoulder", "right_shoulder"]
  frame:
    up:
      from: hips_center
      to: neck_center
      kind: exact
    lateral:
      from: left_shoulder
      to: right_shoulder
      kind: approximate
  offset:
    anterior: 0.15
    up: -0.05
    lateral: -0.06
  reference_length: shoulder_width

right_sternoclavicular:
  form: anatomical_offset
  origin: ["left_shoulder", "right_shoulder"]
  frame:
    up:
      from: hips_center
      to: neck_center
      kind: exact
    lateral:
      from: left_shoulder
      to: right_shoulder
      kind: approximate
  offset:
    anterior: 0.15
    up: -0.05
    lateral: 0.06
  reference_length: shoulder_width

# ---- Derived: the sternal midline point ----
#
# mid_sternum is the sternum's anterior midline point at the manubrium level —
# the same estimation basis as the bilateral sternoclavicular joints, which
# straddle it at ±0.06 lateral of shoulder width. Estimated from surface
# anatomy rather than a published table; refine if a sourced value appears.
mid_sternum:
  form: anatomical_offset
  origin: ["left_shoulder", "right_shoulder"]
  frame:
    up:
      from: hips_center
      to: neck_center
      kind: exact
    lateral:
      from: left_shoulder
      to: right_shoulder
      kind: approximate
  offset:
    anterior: 0.15
    up: -0.05
  reference_length: shoulder_width

# ---- Derived: the top of the head ----
#
# head_vertex = head_center + the head's vertical × 0.17 × shoulder width.
# Sourced: Winter (2009) head-center→vertex = 0.040 H, expressed as a ratio of
# shoulder width (0.234 H) ≈ 0.17. The axis is the head's vertical.
head_vertex:
  form: anatomical_offset
  origin: ["head_center"]
  frame:
    up:
      from: neck_center
      to: head_center
      kind: exact
    lateral:
      from: left_eye
      to: right_eye
      kind: approximate
  offset:
    up: 0.17
  reference_length: shoulder_width

# ---- Derived: the ball of the foot ----
#
# foot_ball sits 2/3 of the way ankle→big_toe — the Task 3 2:1 split of the
# ankle→toe span (0.026/0.013 of height) at the metatarsophalangeal joint.
# The approximate axis is the shin direction: the ankle→heel axis would be
# anti-parallel to the forward axis and MediaPipe's foot_index maps both toes
# to one point, so a toe-fan axis would be degenerate there.
left_foot_ball:
  form: anatomical_offset
  origin: ["left_ankle"]
  frame:
    forward:
      from: left_ankle
      to: left_big_toe
      kind: exact
    shin:
      from: left_knee
      to: left_ankle
      kind: approximate
  offset:
    forward: 0.67
  reference_length:
    from: left_ankle
    to: left_big_toe

right_foot_ball:
  form: anatomical_offset
  origin: ["right_ankle"]
  frame:
    forward:
      from: right_ankle
      to: right_big_toe
      kind: exact
    shin:
      from: right_knee
      to: right_ankle
      kind: approximate
  offset:
    forward: 0.67
  reference_length:
    from: right_ankle
    to: right_big_toe

# ---- Derived: the jaw (chin) ----
#
# jaw = nose + down 0.9 × eye_width + posterior 0.2 × eye_width.
# Estimated from the facial-proportions canon (eye width as the facial-third
# unit) rather than a published table; refine if a sourced value appears.
# The same ratios derive the jaw segment's rest direction (Task 4) — change
# one, change the other.
jaw:
  form: anatomical_offset
  origin: ["nose"]
  frame:
    up:
      from: neck_center
      to: head_center
      kind: exact
    lateral:
      from: left_eye
      to: right_eye
      kind: approximate
  offset:
    up: -0.9
    anterior: -0.2
  reference_length: eye_width
