---
# Named skeleton for the COCO17 body-only schema. Edges are name-based, so
# they carry over unchanged regardless of tracked_points array order.
# Ported verbatim from rtmpose/body/rtmpose_body.yaml (M4b migration).
- name: rtmpose_body_skeleton
  edges:
    - [nose, left_eye]
    - [nose, right_eye]
    - [left_eye, left_ear]
    - [right_eye, right_ear]
    - [left_shoulder, right_shoulder]
    - [left_shoulder, left_elbow]
    - [left_elbow, left_wrist]
    - [right_shoulder, right_elbow]
    - [right_elbow, right_wrist]
    - [left_shoulder, left_hip]
    - [right_shoulder, right_hip]
    - [left_hip, right_hip]
    - [left_hip, left_knee]
    - [left_knee, left_ankle]
    - [right_hip, right_knee]
    - [right_knee, right_ankle]
