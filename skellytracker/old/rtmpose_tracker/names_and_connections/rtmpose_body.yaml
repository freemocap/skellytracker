---
# RTMPose COCO133 body tracked points and skeleton connections.
# 23 landmarks (COCO17 + 6 foot keypoints).
name: rtmpose_body
tracker_type: rtmpose
landmark_schema: COCO_WholeBody

tracked_points:
  - nose
  - left_eye
  - right_eye
  - left_ear
  - right_ear
  - left_shoulder
  - right_shoulder
  - left_elbow
  - right_elbow
  - left_wrist
  - right_wrist
  - left_hip
  - right_hip
  - left_knee
  - right_knee
  - left_ankle
  - right_ankle
  - left_big_toe
  - left_small_toe
  - left_heel
  - right_big_toe
  - right_small_toe
  - right_heel

connections:
  # face
  - [nose, left_eye]
  - [nose, right_eye]
  - [left_eye, left_ear]
  - [right_eye, right_ear]
  - [left_ear, right_ear]
  # shoulder girdle
  - [left_shoulder, right_shoulder]
  # left arm
  - [left_shoulder, left_elbow]
  - [left_elbow, left_wrist]
  # right arm
  - [right_shoulder, right_elbow]
  - [right_elbow, right_wrist]
  # torso
  - [left_shoulder, left_hip]
  - [right_shoulder, right_hip]
  - [left_hip, right_hip]
  # left leg
  - [left_hip, left_knee]
  - [left_knee, left_ankle]
  # right leg
  - [right_hip, right_knee]
  - [right_knee, right_ankle]
  # left foot
  - [left_ankle, left_heel]
  - [left_heel, left_big_toe]
  - [left_ankle, left_big_toe]
  - [left_ankle, left_small_toe]
  # right foot
  - [right_ankle, right_heel]
  - [right_heel, right_big_toe]
  - [right_ankle, right_big_toe]
  - [right_ankle, right_small_toe]
