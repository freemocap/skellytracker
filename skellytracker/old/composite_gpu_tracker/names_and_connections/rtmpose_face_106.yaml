---
# RTMPose face tracked points — LaPa 106-keypoint format.
# The model outputs 106 keypoints; the LaPa dataset defines no skeleton
# connections, so we only draw the major anatomical chains that can be
# inferred from the symmetric swap-pair structure.
#
# Known groupings (inferred from LaPa swap symmetry):
#   0–32  Jawline contour (16 pairs + 1 center)
#   33–37 Left eyebrow   42–46  Right eyebrow
#   38–41 Left eye upper  47–50  Right eye upper
#   51–54 Nose bridge
#   55–65 Eye details (l/r symmetric around 60)
#   66–83 Outer + inner lips
#   84–90 Nose lower
#   91–95  (upper eye)
#   96–100 (pupil region)
#   101–103 (inner eye)
#   104–105 (eyelid tips)
#
# Only the jawline, brows, and nose bridge are connected — these are
# structurally unambiguous from the symmetry data. The rest are drawn
# as individual points only.
name: rtmpose_face_106
tracker_type: rtmpose
landmark_schema: LaPa_106

tracked_points:
