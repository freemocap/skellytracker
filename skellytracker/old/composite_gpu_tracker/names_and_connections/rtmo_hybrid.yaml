---
# Composite definition for the RTMO hybrid GPU tracker.
# Flattens RTMO body (17) + RTMPose right_hand (21) + RTMPose left_hand (21)
# + RTMPose face (106 LaPa) into a single namespace with side-specific hand prefixes.
#
# Resulting name order: [body.17][right_hand.21][left_hand.21][face.106] = 165 total
name: rtmo_hybrid
tracker_type: rtmo_hybrid
landmark_schema: composite

composed_of:
  - path: rtmo_body_17.yaml
    prefix: ""
  - path: ../../mediapipe_tracker/names_and_connections/mediapipe_hand.yaml
    prefix: "right_hand_"
  - path: ../../mediapipe_tracker/names_and_connections/mediapipe_hand.yaml
    prefix: "left_hand_"
  - path: rtmpose_face_106.yaml
    prefix: ""
