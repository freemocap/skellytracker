---
# Composite definition for the RTMPose wholebody tracker (COCO133).
# Flattens body + right_hand + left_hand + face into a single namespace
# with side-specific prefixes to avoid name collisions.
#
# Resulting name order: [body.23][right_hand.21][left_hand.21][face.68] = 133 total
name: rtmpose_wholebody
tracker_type: rtmpose
landmark_schema: composite

composed_of:
  - path: rtmpose_body.yaml
    prefix: ""
  - path: rtmpose_hand.yaml
    prefix: "right_hand_"
  - path: rtmpose_hand.yaml
    prefix: "left_hand_"
  - path: rtmpose_face.yaml
    prefix: ""
