---
# Composite definition for the mediapipe holistic tracker.
# Flattens body + right_hand + left_hand + face_contour into a single
# namespace with side-specific prefixes to avoid name collisions.
#
# Resulting name order: [body.33][right_hand.21][left_hand.21][face_contour.136]
name: mediapipe_holistic
tracker_type: mediapipe

composed_of:
  - path: body/mediapipe_body.yaml
    prefix: ""
  - path: hands/mediapipe_hand.yaml
    prefix: "right_hand_"
  - path: hands/mediapipe_hand.yaml
    prefix: "left_hand_"
  - path: face/face_contour/mediapipe_face_contour.yaml
    prefix: ""
