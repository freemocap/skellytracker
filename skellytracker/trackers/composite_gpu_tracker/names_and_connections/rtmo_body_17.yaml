---
# RTMO one-stage body tracked points and skeleton connections.
# 17 COCO body keypoints — RTMO outputs detection + pose in a single pass.
# Note: this is the COCO17 subset, NOT the 23-point COCO-WholeBody body
# (which adds 6 foot keypoints). RTMO does not produce foot keypoints.
name: rtmo_body_17
tracker_type: rtmo
landmark_schema: COCO17

tracked_points:
  - nose
  - left_eye
  - right_eye
  - left_ear
  - right_ear
  - left_shoulder
  - right_shoulder
  - left_elbow
  - right_elbow
  - left_wrist
  - right_wrist
  - left_hip
  - right_hip
  - left_knee
  - right_knee
  - left_ankle
  - right_ankle

connections:
  # face
  - [nose, left_eye]
  - [nose, right_eye]
  - [left_eye, left_ear]
  - [right_eye, right_ear]
  # shoulder girdle
  - [left_shoulder, right_shoulder]
  # left arm
  - [left_shoulder, left_elbow]
  - [left_elbow, left_wrist]
  # right arm
  - [right_shoulder, right_elbow]
  - [right_elbow, right_wrist]
  # torso
  - [left_shoulder, left_hip]
  - [right_shoulder, right_hip]
  - [left_hip, right_hip]
  # left leg
  - [left_hip, left_knee]
  - [left_knee, left_ankle]
  # right leg
  - [right_hip, right_knee]
  - [right_knee, right_ankle]
