# pyproject.toml
# originally based on - https://realpython.com/pypi-publish-python-package/

[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "skellytracker"
readme = "README.md"
authors = [
    { name = "Skelly FreeMoCap", email = "info@freemocap.org" },
]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Other Audience",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Multimedia :: Video :: Display",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: System :: Hardware",
    "Topic :: System :: Hardware :: Universal Serial Bus (USB)",
    "Topic :: System :: Hardware :: Universal Serial Bus (USB) :: Video (UVC)",
]
keywords = [
    "camera",
    "stream",
    "video",
    "image",
    "opencv",
    "skelly",
    "freemocap",
    "motion capture",
    "synchronization",
    "computer vision"
]

dependencies = [
    "opencv-contrib-python",
    "pydantic==2.*",
    "numpy<2",
    "tqdm==4.*",
    "numpydantic>=1.6.7",
    "requests>=2.32.3",
]
requires-python = ">=3.9,<3.13"

dynamic = ["version", "description"]

# Optional dependencies — used by downstream packages via skellytracker[mediapipe] etc.
[project.optional-dependencies]
mediapipe = ["mediapipe>=0.10.21"]
legacy-mediapipe = ["mediapipe==0.10.14"]
yolo = ["ultralytics~=8.0.202"]
rtmpose-cpu = ["rtmlib==0.0.14", "onnxruntime"]
rtmpose-gpu = ["rtmlib==0.0.14", "onnxruntime-gpu"]
all = ["mediapipe>=0.10.21", "ultralytics~=8.0.202"]

# Dependency groups — used for local development via `uv sync --group <name>`
[dependency-groups]
dev = ["black", "bumpver", "isort", "pip-tools", "pytest", "ruff"]
mediapipe = ["mediapipe>=0.10.21"]
legacy-mediapipe = ["mediapipe==0.10.14"]
yolo = ["ultralytics~=8.0.202"]
rtmpose-cpu = [
  "rtmlib==0.0.14",
  "onnxruntime",
]
rtmpose-gpu = [
    "rtmlib==0.0.14",
    "onnxruntime-gpu",
]

# Tell uv which dependency groups conflict with each other and cannot
# be installed simultaneously. Without this, `uv sync` tries to resolve
# all groups at once and fails on the version contradictions.
[tool.uv]
conflicts = [
    [
        { group = "mediapipe" },
        { group = "legacy-mediapipe" },
    ],
    [
        { group = "rtmpose-cpu" },
        { group = "rtmpose-gpu" },
    ],
]

[project.urls]
Homepage = "https://github.com/freemocap/skellytracker"

[tool.bumpver]
current_version = "v2024.09.1019"

version_pattern = "vYYYY.0M.BUILD[-TAG]"
commit_message = "Bump version {old_version} -> {new_version}"
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"skellytracker/__init__.py" = ["{version}"]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S101"]

[tool.ruff.lint]
extend-select = ["B", "S", "C4", "ISC", "PERF"]

[project.scripts]
skellytracker = "skellytracker.__main__:cli_main"
skellytracker_blendshapes = "skellytracker.scripts.blendshapes_to_csv:main"

[tool.setuptools]
py-modules = ["skellytracker"]