# pyproject.toml
# originally based on - https://realpython.com/pypi-publish-python-package/

[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "skellytracker"
readme = "README.md"
authors = [
    { name = "Skelly FreeMoCap", email = "info@freemocap.org" },
]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Other Audience",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Multimedia :: Video :: Display",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: System :: Hardware",
    "Topic :: System :: Hardware :: Universal Serial Bus (USB)",
    "Topic :: System :: Hardware :: Universal Serial Bus (USB) :: Video (UVC)",
]
keywords = [
    "camera",
    "stream",
    "video",
    "image",
    "opencv",
    "skelly",
    "freemocap",
    "motion capture",
    "synchronization",
    "computer vision",
]

dependencies = [
    "opencv-contrib-python",
    "pydantic==2.*",
    "numpy",
    "tqdm==4.*",
    "numpydantic>=1.6.7",
    "requests>=2.32.3",
    "beartype>=0.19",
    "pyyaml>=6.0",
    "polars",
]
requires-python = ">=3.11,<3.13"

dynamic = ["version", "description"]

# Extras for package consumers: `pip install skellytracker[rtmpose-gpu]`
# Also usable in local dev: `uv sync --extra rtmpose-gpu`
[project.optional-dependencies]
legacy-mediapipe = ["mediapipe==0.10.14"]
mediapipe = ["mediapipe==0.10.33"]
yolo = ["ultralytics~=8.0.202"]
#
## RTMPose — CPU only
rtmpose-cpu = ["rtmlib==0.0.14", "onnxruntime", "onnx"]

# RTMPose — NVIDIA GPU via CUDA 12
# Bundles the CUDA 12 + cuDNN 9 runtime DLLs as pip packages so users
# don't need to install the CUDA Toolkit or cuDNN manually.
# We pin onnxruntime-gpu<1.27 together with the CUDA 12 libs: ORT <1.27 on PyPI is
# built against CUDA 12, but ORT 1.27+ switched its PyPI build to CUDA 13 (it links
# cublasLt64_13.dll / cudart64_13.dll etc., needs a newer driver floor, and drops
# Maxwell/Pascal/Volta GPUs). Without the cap, a fresh resolve grabs 1.27, which then
# fails to load its CUDA EP against these cu12 DLLs and silently falls back to CPU.
# Capping below 1.27 keeps ORT on the CUDA 12 build that matches these libs — the
# widest GPU/driver compatibility. NVIDIA drivers are backward compatible, so users
# with newer drivers (e.g. CUDA 13 capable) still work fine on these cu12 libs.
# Code must call `onnxruntime.preload_dlls(directory="")` before creating a session
# so ORT finds these pip-installed DLLs — skellytracker already does this.
rtmpose-gpu = [
    "onnxruntime-gpu<1.27; sys_platform != 'darwin'",
    "onnx",
    "nvidia-cuda-runtime-cu12; sys_platform != 'darwin'",
    "nvidia-cublas-cu12; sys_platform != 'darwin'",
    "nvidia-cufft-cu12; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12; sys_platform != 'darwin'",
]

# RTMPose — any GPU on Windows via DirectML (AMD, Intel, NVIDIA, Qualcomm)
# No CUDA toolkit needed. Just pip install and go.
rtmpose-directml = ["onnxruntime-directml; sys_platform == 'win32'", "onnx"]

# RTMPose — NVIDIA GPU via CUDA 12 + TensorRT (2-5x faster than CUDA EP alone)
# Requires an NVIDIA GPU. First run triggers engine compilation (1-5 min); cached thereafter.
# Install with: uv pip install -e ".[rtmpose-trt]"
rtmpose-trt = [
    "onnxruntime-gpu<1.27; sys_platform != 'darwin'",
    "onnx",
    "nvidia-cuda-runtime-cu12; sys_platform != 'darwin'",
    "nvidia-cublas-cu12; sys_platform != 'darwin'",
    "nvidia-cufft-cu12; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12; sys_platform != 'darwin'",
    "tensorrt; sys_platform != 'darwin'",
]

# RECOMMENDED - mediapipe + RTMPose with TensorRT (2-5x faster than CUDA EP alone).
# Requires an NVIDIA GPU. First run compiles TRT engines (1-5 min); cached thereafter.
recommended = [
    "mediapipe==0.10.33",
    "onnxruntime-gpu<1.27; sys_platform != 'darwin'",
    "onnx",
    "nvidia-cuda-runtime-cu12; sys_platform != 'darwin'",
    "nvidia-cublas-cu12; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12; sys_platform != 'darwin'",
    "nvidia-cufft-cu12; sys_platform != 'darwin'",
    "tensorrt; sys_platform != 'darwin'",
]

# Dev-only tooling: `uv sync` (installed by default via default-groups)
[dependency-groups]
dev = [
    "black",
    "bumpver",
    "isort",
    "pip-tools",
    "poethepoet>=0.32.0",
    "pytest",
    "ruff",
]

[tool.uv]
package = true
default-groups = ["dev"]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

# rtmlib==0.0.14 hard-depends on the CPU `onnxruntime` package. We want the
# GPU build (`onnxruntime-gpu`) or the DirectML build (`onnxruntime-directml`)
# instead, pulled in via the relevant extra. All three packages provide the
# same top-level `onnxruntime` Python import, but they cannot coexist on disk:
# they share the same namespace directory and their DLLs / .pyd files clobber
# each other, producing a broken install that fails at import with things like
# `AttributeError: module 'onnxruntime' has no attribute 'get_available_providers'`.
#
# `exclude-dependencies` drops the CPU `onnxruntime` package from the resolution
# graph entirely, even when rtmlib requests it transitively. rtmlib still works
# at runtime because whichever accelerated build is installed provides the
# `onnxruntime` import.
#
# Caveat: this setting only takes effect when uv resolves this workspace. A
# downstream `pip install skellytracker[recommended]` will NOT honor it and
# will reintroduce the conflict. The upstream fix is for rtmlib to stop pinning
# `onnxruntime` as a hard dependency.
#exclude-dependencies = ["onnxruntime"]

conflicts = [
    [
        { extra = "rtmpose-cpu" },
        { extra = "rtmpose-gpu" },
        { extra = "rtmpose-trt" },
        { extra = "rtmpose-directml" },
        { extra = "recommended" },
    ],
    [
        { extra = "legacy-mediapipe" },
        { extra = "mediapipe" },
        { extra = "recommended" },
    ],
]

[project.urls]
Homepage = "https://github.com/freemocap/skellytracker"

[tool.bumpver]
current_version = "v2024.09.1019"
version_pattern = "vYYYY.0M.BUILD[-TAG]"
commit_message = "Bump version {old_version} -> {new_version}"
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"skellytracker/__init__.py" = ["{version}"]

[tool.ruff.lint]
extend-select = ["B", "S", "C4", "ISC", "PERF"]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S101"]

[project.scripts]
skellytracker = "skellytracker.__main__:cli_main"
skellytracker_blendshapes = "skellytracker.scripts.blendshapes_to_csv:main"

[tool.uv.sources]
skellytracker-rust = { path = "skellytracker-rust" }

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

# =============================================================================
# Task runner (poethepoet)
# =============================================================================
# List all tasks:        uv run poe --help
#
#   uv run poe rebuild     Rebuild Rust engine (verbose cargo output)
#   uv run poe lint        Run all ruff lint rules
#   uv run poe lint-fix    Auto-fix all ruff lint violations
#   uv run poe test        Run pytest
#
# =============================================================================

[tool.poe.tasks]
rebuild  = { cmd = "uv sync -v --reinstall-package skellytracker-rust --reinstall-package skellytracker", help = "Rebuild Rust engine with full cargo output" }
lint     = { cmd = "ruff check skellytracker/", help = "Run all ruff lint rules" }
lint-fix = { cmd = "ruff check --fix skellytracker/", help = "Auto-fix all ruff lint violations" }
test     = { cmd = "pytest", help = "Run test suite" }
