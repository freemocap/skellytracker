# pyproject.toml
# originally based on - https://realpython.com/pypi-publish-python-package/

[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "skellytracker"
readme = "README.md"
authors = [
    { name = "Skelly FreeMoCap", email = "info@freemocap.org" },
]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Other Audience",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Multimedia :: Video :: Display",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: System :: Hardware",
    "Topic :: System :: Hardware :: Universal Serial Bus (USB)",
    "Topic :: System :: Hardware :: Universal Serial Bus (USB) :: Video (UVC)",
]
keywords = [
    "camera",
    "stream",
    "video",
    "image",
    "opencv",
    "skelly",
    "freemocap",
    "motion capture",
    "synchronization",
    "computer vision",
]

dependencies = [
    "opencv-contrib-python",
    "pydantic==2.*",
    "numpy==2.4.6",
    "tqdm==4.*",
    "numpydantic>=1.6.7",
    "requests>=2.32.3",
    "beartype>=0.19",
    "pyyaml>=6.0",
    "polars",
    "scipy",
]
requires-python = ">=3.11,<3.13"

dynamic = ["version", "description"]

# Extras for package consumers: `pip install skellytracker[all-cuda]`
# Also usable in local dev: `uv sync --extra all-cuda`
[project.optional-dependencies]
# ── Detector-library extras ───────────────────────────────────────────────────
# Install the tracker libraries you want to use. These are independent of the
# ONNX session backend — add one of the onnx-* extras below to run inference.

mediapipe = ["mediapipe==0.10.33"]

# RTMPose + YOLOX detectors (vendored, see skellytracker/core/detectors) need
# the onnx package for graph surgery. Requires one of the onnx-* session extras.
onnx = ["onnx"]

# ── ONNX session/backend extras ──────────────────────────────────────────────
# Pick exactly one that matches your hardware. These provide the ONNX Runtime
# used by the RTMPose + YOLOX detectors for inference.

# CPU — any platform. Also enables CoreML EP on macOS with Apple Silicon.
onnx-cpu = ["onnxruntime"]

# NVIDIA GPU via CUDA 12 (Linux / Windows).
# Bundles the CUDA 12 + cuDNN 9 runtime DLLs as pip packages so users
# don't need to install the CUDA Toolkit or cuDNN manually.
# We pin onnxruntime-gpu<1.27: ORT <1.27 on PyPI is built against CUDA 12, but
# ORT 1.27+ switched to CUDA 13 (links cublasLt64_13.dll etc., needs a newer
# driver floor, drops Maxwell/Pascal/Volta). Without the cap a fresh resolve grabs
# 1.27, which fails to load its CUDA EP against these cu12 DLLs and silently falls
# back to CPU. NVIDIA drivers are backward-compatible, so users with newer drivers
# still work fine on the cu12 libs.
# Code must call `onnxruntime.preload_dlls(directory="")` before creating a session
# so ORT finds these pip-installed DLLs — skellytracker already does this.
onnx-cuda = [
    "onnxruntime-gpu<1.27; sys_platform != 'darwin'",
    "nvidia-cuda-runtime-cu12; sys_platform != 'darwin'",
    "nvidia-cublas-cu12; sys_platform != 'darwin'",
    "nvidia-cufft-cu12; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12; sys_platform != 'darwin'",
]

# NVIDIA GPU via CUDA 12 + TensorRT (2-5x faster than CUDA EP alone).
# First run compiles TRT engines (1-5 min); cached thereafter.
# tensorrt is pinned to the 10.x line: onnxruntime-gpu<1.27's bundled TensorRT EP
# is built against the TensorRT 10.x ABI (it loads nvinfer_10.dll). Letting this
# float to TensorRT 11.x (released 2026 Q2) installs nvinfer_11.dll instead, so
# the EP fails to load with "nvinfer_10.dll is missing" and silently falls back
# to CUDA/CPU.
onnx-trt = [
    "onnxruntime-gpu<1.27; sys_platform != 'darwin'",
    "nvidia-cuda-runtime-cu12; sys_platform != 'darwin'",
    "nvidia-cublas-cu12; sys_platform != 'darwin'",
    "nvidia-cufft-cu12; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12; sys_platform != 'darwin'",
    "tensorrt>=10,<11; sys_platform != 'darwin'",
]

# Any GPU on Windows via DirectML (AMD, Intel, NVIDIA, Qualcomm). No CUDA needed.
onnx-directml = ["onnxruntime-directml; sys_platform == 'win32'"]

# ── Convenience bundles ───────────────────────────────────────────────────────
# mediapipe + onnx + the matching ONNX session backend.

all-cpu      = ["skellytracker[mediapipe,onnx,onnx-cpu]"]
all-cuda     = ["skellytracker[mediapipe,onnx,onnx-cuda]"]
all-trt      = ["skellytracker[mediapipe,onnx,onnx-trt]"]
all-directml = ["skellytracker[mediapipe,onnx,onnx-directml]"]

# Recommended installs — sensible defaults for the most common hardware targets.
# CPU/Mac users (includes CoreML on Apple Silicon): uv sync --extra recommended-cpu
recommended-cpu  = ["skellytracker[all-cpu]"]
# NVIDIA GPU users (TensorRT for best performance): uv sync --extra recommended-cuda
recommended-cuda = ["skellytracker[all-trt]"]

# Dev-only tooling: `uv sync` (installed by default via default-groups)
[dependency-groups]
dev = [
    "black",
    "bumpver",
    "isort",
    "pip-tools",
    "poethepoet>=0.32.0",
    "pytest",
    "ruff",
]

[tool.uv]
package = true
default-groups = ["dev"]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

# opencv-python is excluded because this project uses opencv-contrib-python,
# which provides a superset of opencv-python; having both installed causes a
# file-collision error.
exclude-dependencies = ["opencv-python"]

conflicts = [
    [
        { extra = "onnx-cpu" },
        { extra = "onnx-cuda" },
        { extra = "onnx-trt" },
        { extra = "onnx-directml" },
    ],
]

[project.urls]
Homepage = "https://github.com/freemocap/skellytracker"

[tool.bumpver]
current_version = "v2024.09.1019"
version_pattern = "vYYYY.0M.BUILD[-TAG]"
commit_message = "Bump version {old_version} -> {new_version}"
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"skellytracker/__init__.py" = ["{version}"]

[tool.ruff.lint]
extend-select = ["B", "S", "C4", "ISC", "PERF"]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S101"]

[project.scripts]
skellytracker = "skellytracker.__main__:cli_main"
skellytracker_blendshapes = "skellytracker.scripts.blendshapes_to_csv:main"

[tool.uv.sources]
skellytracker-rust = { path = "skellytracker-rust" }

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

# =============================================================================
# Task runner (poethepoet)
# =============================================================================
# List all tasks:        uv run poe --help
#
#   uv run poe rebuild     Rebuild Rust engine (verbose cargo output)
#   uv run poe lint        Run all ruff lint rules
#   uv run poe lint-fix    Auto-fix all ruff lint violations
#   uv run poe test        Run pytest
#
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["skellytracker/tests"]
markers = [
    "video: tests that run inference over real video frames (slow, requires test recording)",
]

[tool.poe.tasks]
rebuild   = { cmd = "uv sync -v --reinstall-package skellytracker-rust --reinstall-package skellytracker", help = "Rebuild Rust engine with full cargo output" }
lint      = { cmd = "ruff check skellytracker/", help = "Run all ruff lint rules" }
lint-fix  = { cmd = "ruff check --fix skellytracker/", help = "Auto-fix all ruff lint violations" }
test      = { cmd = "pytest", help = "Run full test suite" }
test-fast = { cmd = "pytest -m 'not video'", help = "Run tests excluding slow video tests" }
