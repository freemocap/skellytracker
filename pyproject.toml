# pyproject.toml
# originally based on - https://realpython.com/pypi-publish-python-package/

[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "skellytracker"
readme = "README.md"
authors = [
    { name = "Skelly FreeMoCap", email = "info@freemocap.org" },
]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Other Audience",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Multimedia :: Video :: Display",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: System :: Hardware",
    "Topic :: System :: Hardware :: Universal Serial Bus (USB)",
    "Topic :: System :: Hardware :: Universal Serial Bus (USB) :: Video (UVC)",
]
keywords = [
    "camera",
    "stream",
    "video",
    "image",
    "opencv",
    "skelly",
    "freemocap",
    "motion capture",
    "synchronization",
    "computer vision",
]

dependencies = [
    "opencv-contrib-python",
    "pydantic==2.*",
    "numpy",
    "tqdm==4.*",
    "numpydantic>=1.6.7",
    "requests>=2.32.3",
    "beartype>=0.19",
]
requires-python = ">=3.11,<3.13"

dynamic = ["version", "description"]

# Extras for package consumers: `pip install skellytracker[rtmpose-gpu]`
# Also usable in local dev: `uv sync --extra rtmpose-gpu`
[project.optional-dependencies]
legacy-mediapipe = ["mediapipe==0.10.14"]
mediapipe = ["mediapipe==0.10.33"]
yolo = ["ultralytics~=8.0.202"]
#
## RTMPose — CPU only
#rtmpose-cpu = ["rtmlib==0.0.14", "onnxruntime"]

# RTMPose — NVIDIA GPU via CUDA 12
# Bundles the CUDA 12 + cuDNN 9 runtime DLLs as pip packages so users
# don't need to install the CUDA Toolkit or cuDNN manually.
# We pin to CUDA 12 libs because onnxruntime-gpu on PyPI is built against CUDA 12.
# NVIDIA drivers are backward compatible, so users with newer drivers (e.g. CUDA 13)
# can still use these CUDA 12 libs without issue — the driver just needs to support
# CUDA >= 12 (check via `nvidia-smi`).
# Code must call `onnxruntime.preload_dlls(directory="")` before creating a session
# so ORT finds these pip-installed DLLs — skellytracker already does this.
rtmpose-gpu = [
    "rtmlib==0.0.14",
    "onnxruntime-gpu",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cublas-cu12",
    "nvidia-cufft-cu12",
    "nvidia-cudnn-cu12",
]

# RTMPose — any GPU on Windows via DirectML (AMD, Intel, NVIDIA, Qualcomm)
# No CUDA toolkit needed. Just pip install and go.
# Note: requires a one-line patch to rtmlib to add 'directml' device support —
# see GPU_SETUP_GUIDE.md for details.
rtmpose-directml = ["rtmlib==0.0.14", "onnxruntime-directml"]

# RECOMMENDED - regular mediapipe with GPU RTMPose.
recommended = [
    "mediapipe==0.10.33",
    "rtmlib==0.0.14",
    "onnxruntime-gpu",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cublas-cu12",
    "nvidia-cufft-cu12",
    "nvidia-cudnn-cu12", ]#"ultralytics~=8.0.202"]

# Dev-only tooling: `uv sync` (installed by default via default-groups)
[dependency-groups]
dev = ["black", "bumpver", "isort", "pip-tools", "pytest", "ruff"]

[tool.uv]
default-groups = ["dev"]

# rtmlib==0.0.14 hard-depends on the CPU `onnxruntime` package. We want the
# GPU build (`onnxruntime-gpu`) or the DirectML build (`onnxruntime-directml`)
# instead, pulled in via the relevant extra. All three packages provide the
# same top-level `onnxruntime` Python import, but they cannot coexist on disk:
# they share the same namespace directory and their DLLs / .pyd files clobber
# each other, producing a broken install that fails at import with things like
# `AttributeError: module 'onnxruntime' has no attribute 'get_available_providers'`.
#
# `exclude-dependencies` drops the CPU `onnxruntime` package from the resolution
# graph entirely, even when rtmlib requests it transitively. rtmlib still works
# at runtime because whichever accelerated build is installed provides the
# `onnxruntime` import.
#
# Caveat: this setting only takes effect when uv resolves this workspace. A
# downstream `pip install skellytracker[recommended]` will NOT honor it and
# will reintroduce the conflict. The upstream fix is for rtmlib to stop pinning
# `onnxruntime` as a hard dependency.
exclude-dependencies = ["onnxruntime"]

conflicts = [
    [
#        { extra = "rtmpose-cpu" },
        { extra = "rtmpose-gpu" },
        { extra = "rtmpose-directml" },
        { extra = "recommended" },
    ],
    [
        { extra = "legacy-mediapipe" },
        { extra = "mediapipe" },
        { extra = "recommended" },
    ],
]

[project.urls]
Homepage = "https://github.com/freemocap/skellytracker"

[tool.bumpver]
current_version = "v2024.09.1019"
version_pattern = "vYYYY.0M.BUILD[-TAG]"
commit_message = "Bump version {old_version} -> {new_version}"
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"skellytracker/__init__.py" = ["{version}"]

[tool.ruff.lint]
extend-select = ["B", "S", "C4", "ISC", "PERF"]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S101"]

[project.scripts]
skellytracker = "skellytracker.__main__:cli_main"
skellytracker_blendshapes = "skellytracker.scripts.blendshapes_to_csv:main"
