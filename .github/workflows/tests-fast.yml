name: Fast tests

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-fast:
    name: Fast tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-caching: true
      - run: uv sync --extra recommended
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/skellytracker/test_images
            ~/.cache/skellytracker/models
            ~/.freemocap/skellytracker-models
          key: test-assets-${{ runner.os }}-v1
      - run: uv run pytest -m "not video"
