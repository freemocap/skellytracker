name: Fast tests

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-fast:
    name: Fast tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra recommended-cpu
      - run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-glx xvfb
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/skellytracker/test_images
            ~/.cache/skellytracker/models
            ~/.freemocap/skellytracker-models
          key: test-assets-${{ runner.os }}-v1
      - run: xvfb-run -a uv run pytest -m "not video"
