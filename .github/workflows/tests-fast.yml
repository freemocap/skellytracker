name: Fast tests

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-fast:
    name: Fast tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra recommended-cpu
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/skellytracker/test_images
            ~/.cache/skellytracker/models
            ~/.freemocap/skellytracker-models
          key: test-assets-${{ runner.os }}-v1
      - run: uv run pytest -m "not video"
