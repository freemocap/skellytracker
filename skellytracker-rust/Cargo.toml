[package]
name = "skellytracker"
version = "0.1.0"
edition = "2021"
description = "Rust port of SkellyTracker pose-estimation backend"

[dependencies]
nokhwa = { version = "0.10", features = ["input-native"] }
image = "0.25"
imageproc = "0.25"
opencv = { version = "0.98", features = ["clang-runtime"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
anyhow = "1"
ndarray = "0.15"
npyz = "0.7"
minifb = "0.27"

[[bin]]
name = "demo"
path = "src/bin/demo.rs"

