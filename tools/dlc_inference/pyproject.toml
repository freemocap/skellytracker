[project]
name = "skellytracker-dlc-inference-tools"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "torch==2.14.1",
    "torchvision==0.29.1",
    "timm==1.0.30",
    "numpy==2.4.6",
    "pyyaml==6.0.3",
    "onnx==1.23.2",
    "onnxruntime==1.26.0",
    "onnxscript>=0.5,<1",
    "pytest>=8,<9",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
