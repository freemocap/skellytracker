[project]
name = "freemocap-dlc-foundation-environment"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "deeplabcut==3.0.2",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "pytest>=8,<9",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
